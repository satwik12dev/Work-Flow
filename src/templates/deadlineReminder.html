<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upcoming Deadline Reminder - WorkFlowX</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 24px; color: #1e293b; }
    .card { max-width: 550px; margin: 0 auto; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 32px; }
    .logo { font-size: 24px; font-weight: 700; color: #2563eb; margin-bottom: 24px; }
    .due-box { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 16px; border-radius: 6px; margin: 20px 0; font-weight: 600; }
    .btn { display: inline-block; background-color: #2563eb; color: #ffffff !important; text-decoration: none; padding: 12px 24px; font-weight: 600; border-radius: 6px; margin: 20px 0; }
    .footer { font-size: 12px; color: #64748b; margin-top: 24px; border-top: 1px solid #f1f5f9; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">WorkFlowX</div>
    <h2>Deadline Approaching</h2>
    <p>Hello <strong>{{employeeName}}</strong>,</p>
    <p>This is a reminder that the deadline for your task <strong>{{taskTitle}}</strong> in project <strong>{{projectName}}</strong> is approaching:</p>
    <div class="due-box">
      Due by: {{dueDate}}
    </div>
    <div style="text-align: center;">
      <a href="{{taskUrl}}" class="btn">View Task</a>
    </div>
    <div class="footer">
      <p>&copy; WorkFlowX Team.</p>
    </div>
  </div>
</body>
</html>
