<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Reassigned - WorkFlowX</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 24px; color: #1e293b; }
    .card { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 32px; }
    .logo { font-size: 24px; font-weight: 700; color: #2563eb; margin-bottom: 24px; }
    .task-meta { width: 100%; border-collapse: collapse; margin: 20px 0; }
    .task-meta td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .task-meta td.label { font-weight: 600; color: #64748b; width: 30%; }
    .btn { display: inline-block; background-color: #2563eb; color: #ffffff !important; text-decoration: none; padding: 12px 24px; font-weight: 600; border-radius: 6px; margin: 20px 0; }
    .footer { font-size: 12px; color: #64748b; margin-top: 24px; border-top: 1px solid #f1f5f9; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">WorkFlowX</div>
    <h2>Task Reassigned to You</h2>
    <p>Hello <strong>{{employeeName}}</strong>,</p>
    <p>The following task has been reassigned to you by <strong>{{reassignedBy}}</strong>.</p>
    
    <table class="task-meta">
      <tr>
        <td class="label">Task Title</td>
        <td><strong>{{taskTitle}}</strong></td>
      </tr>
      <tr>
        <td class="label">Project</td>
        <td>{{projectName}}</td>
      </tr>
      <tr>
        <td class="label">Priority</td>
        <td>{{priority}}</td>
      </tr>
      <tr>
        <td class="label">Deadline</td>
        <td>{{dueDate}}</td>
      </tr>
    </table>

    <div style="text-align: center;">
      <a href="{{taskUrl}}" class="btn">Open Task</a>
    </div>

    <div class="footer">
      <p>&copy; WorkFlowX Team.</p>
    </div>
  </div>
</body>
</html>
